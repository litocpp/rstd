[package]
name = "rstd-std"
version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "rstd-std"
module = "rstd"
archive = "rstd"
when = [{ condition = 'target.os == "macos"', source-groups = ["dirs-apple"] }]

[source-groups.dirs-apple]
sources = ["src/dirs/native_apple.mm"]

[dependencies]
rstd-core = { workspace = true, pub = true }
rstd-alloc = { workspace = true, pub = true }
rstd-parse = { workspace = true }

[[when]]
condition = 'target.os == "windows"'
[when.usage]
system-libraries = ["ntdll"]

[features.async-debug]
default = false
