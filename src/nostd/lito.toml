[package]
name = "rstd-nostd"
version.workspace = true
module = "rstd.nostd"

[library]
archive = "rstd.nostd"
discovery = "explicit"
sources = [
  "cxa.cpp",
  "new.cpp",
]

[usage]
private-options = [
  "-fPIC",
  "-Wall",
  "-Wpedantic",
  "-Wno-gnu-statement-expression",
  "-Wno-deprecated-declarations",
  "-Wunknown-attributes",
  "-fsized-deallocation",
]
