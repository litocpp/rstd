[package]
name = "rstd-dlopn"
version.workspace = true
license.workspace = true
authors.workspace = true
target = { os = ["linux", "macos"] }

[lib]
name = "rstd-dlopn"
module = "rstd.dlopn"
archive = "rstd.dlopn"
sources = ["mod.cppm", "dlopn.cpp"]

[usage]
[[when]]
condition = 'target.os == "linux"'
[when.usage]
system-libraries = ["dl"]

[dependencies.rstd-std]
path = "../.."
version = "0.1.0"
pub = true
