[package]
name = "rstd-log"
version.workspace = true
module = "rstd.log"

[library]
archive = "rstd.log"
discovery = "explicit"
sources = [
  "mod.cppm",
  "level.cppm",
  "record.cppm",
  "logger.cppm",
  "macros.cppm",
  "env_logger.cppm",
]

[usage]
private-options = [
  "-fPIC",
  "-Wall",
  "-Wpedantic",
  "-Wno-gnu-statement-expression",
  "-Wno-deprecated-declarations",
  "-Wunknown-attributes",
  "-fsized-deallocation",
]

[dependencies.rstd-core]
path = "../.."
visibility = "public"

[dependencies.rstd-std]
path = "../.."
visibility = "public"
