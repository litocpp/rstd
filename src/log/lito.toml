[package]
name = "rstd-log"
version.workspace = true

[lib]
name = "rstd-log"
module = "rstd.log"
archive = "rstd.log"
discovery = "explicit"
sources = [
  "mod.cppm",
  "level.cppm",
  "record.cppm",
  "logger.cppm",
  "macros.cppm",
  "env_logger.cppm",
]

[dependencies.rstd-core]
path = "../.."
visibility = "public"

[dependencies.rstd-std]
path = "../.."
visibility = "public"
