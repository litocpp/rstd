[package]
name = "rstd-benchmark"
version = "0.1.0"

[[bench]]
module = "rstd"
name = "rstd_bench"
sources = [
  "alloc.cpp",
  "async.cpp",
  "async_bench_tools.cppm",
  "benchmark.cpp",
  "benchmark.cppm",
  "bench_main.cpp",
  "net.cpp",
  "sync.cpp",
]

[usage]
private-definitions = [
  "RSTD_BENCH_BUILD_TYPE=\"Lito\"",
  "RSTD_BENCH_ASAN=0",
]
[dependencies.rstd-bench]
path = ".."

[dependencies.rstd-cppstd]
path = ".."

[dependencies.rstd-json]
path = ".."

[dependencies.rstd-std]
path = ".."
