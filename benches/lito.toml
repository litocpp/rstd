[package]
name = "rstd-benchmark"
version = "0.1.0"

[[bench]]
module = "rstd_benches"
name = "rstd_bench"
sources = [
  "alloc.cpp",
  "domains.cpp",
  "collections.cpp",
  "iter.cpp",
  "slice.cpp",
  "async/support.cppm",
  "async/runtime.cpp",
  "async/loopback.cpp",
  "async/io_operation.cpp",
  "support/mod.cppm",
  "support/report.cpp",
  "support/console.cpp",
  "support/runner.cpp",
  "support/registry.cpp",
  "main.cpp",
  "net.cpp",
  "sync.cpp",
]

[[bench.attach]]
package = "rstd-std"
sources = ["async_bench_tools.cppm"]

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-cppstd = { path = ".." }
rstd-bench = { path = ".." }
rstd-argparse = { path = ".." }
rstd-json = { path = ".." }
rstd-toml = { path = ".." }
rstd-std = { path = ".." }
