[package]
name = "rstd-bench-runner-tests"
version = "0.1.0"
source-root = "../.."

[[test]]
name = "bench-runner"
module = "rstd_benches"
link-stdlib = false
sources = [
  "benches/support/mod.cppm",
  "benches/support/report.cpp",
  "benches/support/console.cpp",
  "benches/support/runner.cpp",
  "benches/alloc.cpp",
  "benches/slice.cpp",
  "benches/domains.cpp",
  "tests/benches/main.cpp",
  "tests/benches/framework.cpp",
  "tests/benches/console.cpp",
  "tests/benches/allocation.cpp",
  "tests/benches/diagnostic.cpp",
  "tests/main/bench.cpp",
  "tests/benches/registry.cpp",
]

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { path = "../.." }
rstd-test = { path = "../.." }
rstd-bench = { path = "../.." }
rstd-argparse = { path = "../.." }
rstd-json = { path = "../.." }
rstd-toml = { path = "../.." }
rstd-nostd = { path = "../..", usage = "link" }
