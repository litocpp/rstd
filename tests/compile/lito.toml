[package]
name = "rstd-compile-tests"

[compile-test]

[[compile-test.cases]]
name = "Choice.DuplicateTags"
source = "choice/duplicate_tags.cpp"
outcome = "failure"
diagnostic-contains = ["all rstd::Choice tags must be unique"]

[[compile-test.cases]]
name = "Choice.Empty"
source = "choice/empty.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Choice requires at least one choice_case"]

[[compile-test.cases]]
name = "Choice.InvalidArguments"
source = "choice/invalid_arguments.cpp"
outcome = "failure"
diagnostic-contains-any = ["no matching function", "constraints not satisfied"]

[[compile-test.cases]]
name = "Choice.InvalidTag"
source = "choice/invalid_tag.cpp"
outcome = "failure"
diagnostic-contains = ["the requested tag is not present in rstd::Choice"]

[[compile-test.cases]]
name = "Choice.MixedTags"
source = "choice/mixed_tags.cpp"
outcome = "failure"
diagnostic-contains = ["all rstd::Choice tags must have the same type"]

[[compile-test.cases]]
name = "Choice.ReferencePayload"
source = "choice/reference_payload.cpp"
outcome = "failure"
diagnostic-contains = ["reference payloads are not supported by rstd::Choice"]

[[compile-test.cases]]
name = "Error.MissingSuperTrait"
source = "error/missing_supertrait.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Impled failed: a required supertrait is not implemented"]

[[compile-test.cases]]
name = "Hash.BuilderInvalidState"
source = "hash/builder_invalid_state.cpp"
outcome = "failure"
diagnostic-contains-any = ["HashBuilder", "Hasher", "constraints not satisfied"]

[[compile-test.cases]]
name = "Hash.BuilderMissing"
source = "hash/builder_missing.cpp"
outcome = "failure"
diagnostic-contains-any = ["HashBuilder", "constraints not satisfied"]

[[compile-test.cases]]
name = "Hash.CallableBuilder"
source = "hash/callable_builder.cpp"
outcome = "failure"
diagnostic-contains-any = ["HashBuilder", "constraints not satisfied"]

[[compile-test.cases]]
name = "Hash.FloatKey"
source = "hash/float_key.cpp"
outcome = "failure"
diagnostic-contains-any = ["HashableBy", "HashableWith", "constraints not satisfied"]

[[compile-test.cases]]
name = "Hash.KeyWithoutHash"
source = "hash/key_without_hash.cpp"
outcome = "failure"
diagnostic-contains-any = ["HashableBy", "HashableWith", "constraints not satisfied"]

[[compile-test.cases]]
name = "Iter.CoreOnly"
source = "iter/core_only.cpp"
outcome = "success"

[[compile-test.cases]]
name = "Iter.EscapingForRange"
source = "iter/escaping_for_range.cpp"
outcome = "failure"
options = ["-Werror=return-stack-address"]
diagnostic-contains-any = ["address of stack memory associated with local variable", "returning address of local temporary object"]

[[compile-test.cases]]
name = "Iter.FloatTotalCmp"
source = "iter/float_total_cmp.cpp"
outcome = "failure"
diagnostic-contains-any = ["constraints not satisfied", "no matching member function"]

[[compile-test.cases]]
name = "Iter.GroupJoinBorrowedResult"
source = "iter/group_join_borrowed_result.cpp"
outcome = "failure"
diagnostic-contains = ["join results must not borrow internal storage"]

[[compile-test.cases]]
name = "Iter.JoinBorrowedResult"
source = "iter/join_borrowed_result.cpp"
outcome = "failure"
diagnostic-contains = ["join results must not borrow internal storage"]

[[compile-test.cases]]
name = "Iter.OwningItemBorrowedKey"
source = "iter/owning_item_borrowed_key.cpp"
outcome = "failure"
diagnostic-contains = ["owning items require independent owning keys"]

[[compile-test.cases]]
name = "Iter.RawItemFromFn"
source = "iter/raw_from_fn.cpp"
outcome = "failure"
diagnostic-contains = ["constraints not satisfied"]

[[compile-test.cases]]
name = "Iter.RawItemMap"
source = "iter/raw_map.cpp"
outcome = "failure"
diagnostic-contains = ["constraints not satisfied"]

[[compile-test.cases]]
name = "Iter.RawItemOnceWithMutable"
