diagnostic-contains = ["static assertion failed"]

[[compile-test.cases]]
name = "Iter.TryReduceWrongOutput"
source = "iter/try_reduce_wrong_output.cpp"
outcome = "failure"
diagnostic-contains = ["static assertion failed"]

[[compile-test.cases]]
name = "LifetimeBound.Positive"
source = "lifetime/positive.cpp"
