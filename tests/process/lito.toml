[package]
name = "rstd-process-tests"
version = "0.1.0"
target = { os = ["linux", "macos"] }

[[bin]]
name = "rstd-process-pipe-check"
sources = ["pipe.cpp"]
link-stdlib = false

[[test]]
name = "rstd-process-tests"
sources = ["main.cpp"]
link-stdlib = false

[[bin]]
name = "rstd-async-process-check"
sources = ["async.cpp"]
link-stdlib = false

[[test]]
name = "rstd-async-process-lifecycle"
sources = ["async_lifecycle.cpp"]
link-stdlib = false

[[test]]
name = "rstd-async-process-command"
sources = ["async_command.cpp"]
link-stdlib = false

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { path = "../../src/std" }
rstd-test = { path = "../../src/test" }
rstd-nostd = { path = "../../src/nostd", usage = "link" }
