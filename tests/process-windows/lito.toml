[package]
name = "rstd-process-windows-tests"
version = "0.1.0"
target = { os = "windows" }

[[test]]
name = "rstd-process-windows-tests"
sources = ["main.cpp"]
link-stdlib = false

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { path = "../../src/std" }
rstd-test = { path = "../../src/test" }
rstd-nostd = { path = "../../src/nostd", usage = "link" }
