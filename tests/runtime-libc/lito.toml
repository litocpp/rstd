[package]
name = "rstd-runtime-libc-tests"
standard = "c17"

[[test]]
name = "rstd-runtime-libc-tests"
sources = ["main.c"]
link-stdlib = false

[usage]
linker-options = [
  "-Wl,--wrap=realloc",
  "-Wl,--wrap=calloc",
  "-Wl,--wrap=posix_memalign",
]

[dependencies]
rstd-runtime = { path = "../../src/runtime" }
