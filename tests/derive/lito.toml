[package]
name = "rstd-derive-tests"

[[test]]
module = "rstd.tests.derive"
name = "rstd-derive-tests"
sources = [
  "main.cpp",
  "enum.cpp",
  "record.cpp",
  "clone.cpp",
  "payload.cpp",
  "errors.cpp",
  "error_fixture.cppm",
  "error_consumer.cpp",
  "fmt_arguments.cpp",
  "fixture.cppm",
  "consumer.cpp",
  "consumer_peer.cpp",
]

[dependencies]
rstd-core = { path = "../../src/core" }
rstd-alloc = { path = "../../src/alloc" }
rstd-std = { path = "../../src/std" }
rstd-test = { path = "../../src/test" }
rstd-macro = { path = "../../src/macro" }

[compile-test]

[[compile-test.cases]]
name = "Derive.ErrorInvalidOptions"
source = "compile/error_options.cpp"
outcome = "failure"
diagnostic-contains = ["variants cannot be combined"]

[[compile-test.cases]]
name = "Derive.ErrorFromAdditionalFields"
source = "compile/error_from_fields.cpp"
outcome = "failure"
diagnostic-contains = ["from requires exactly one field"]

[[compile-test.cases]]
name = "Derive.ErrorMultipleSources"
source = "compile/error_sources.cpp"
outcome = "failure"
diagnostic-contains = ["multiple source fields"]

[[compile-test.cases]]
name = "Derive.ErrorTransparentExplicitSource"
source = "compile/error_transparent_source.cpp"
outcome = "failure"
diagnostic-contains = ["transparent cannot contain an explicit source"]

[[compile-test.cases]]
name = "Derive.ErrorDuplicateFrom"
source = "compile/error_duplicate_from.cpp"
outcome = "failure"
diagnostic-contains = ["Error variants have duplicate From source types"]

[[compile-test.cases]]
name = "Derive.ErrorMissingUnitFormat"
source = "compile/error_missing_unit.cpp"
outcome = "failure"
diagnostic-contains = ["Display variants require exactly one unit format"]

[[compile-test.cases]]
name = "Derive.ErrorUnsupportedFormatEscape"
source = "compile/error_format_escape.cpp"
outcome = "failure"
diagnostic-contains = ["unsupported escape in format string"]

[[compile-test.cases]]
name = "Derive.CloneFieldWithoutClone"
source = "compile/field_without_clone.cpp"
outcome = "failure"
diagnostic-contains = ["Clone fields must implement rstd::clone::Clone"]

[[compile-test.cases]]
name = "Derive.ClonePrivateFieldRequiresFriend"
source = "compile/clone_private_field.cpp"
outcome = "failure"
diagnostic-contains = ["private member"]

[[compile-test.cases]]
name = "Derive.CloneReference"
source = "compile/clone_reference.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Clone fields must not be const or references"]

[[compile-test.cases]]
name = "Derive.CloneBases"
source = "compile/clone_bases.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Clone: records with bases are not supported"]

[[compile-test.cases]]
name = "Derive.CloneDependentRecord"
source = "compile/clone_dependent.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Clone: dependent records are not supported"]

[[compile-test.cases]]
name = "Derive.CloneVariantPayload"
source = "compile/clone_variant_payload.cpp"
outcome = "failure"
diagnostic-contains = ["Clone variant payloads must implement rstd::clone::Clone"]

[[compile-test.cases]]
name = "Derive.PrivateField"
source = "compile/private_field.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Debug: non-skipped fields must be public"]

[[compile-test.cases]]
name = "Derive.Bases"
source = "compile/bases.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Debug: records with bases are not supported"]

[[compile-test.cases]]
name = "Derive.DependentRecord"
source = "compile/dependent.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Debug: dependent records are not supported"]

[[compile-test.cases]]
name = "Derive.RawUnion"
source = "compile/raw_union.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Debug: unions are not supported"]

[[compile-test.cases]]
name = "Derive.Bitfield"
source = "compile/bitfield.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Debug: bitfields are not supported"]

[[compile-test.cases]]
name = "Derive.DisplayMissingFormat"
source = "compile/display_missing_format.cpp"
outcome = "failure"
diagnostic-contains = ['rstd::Display: record requires format("...") or transparent']

[[compile-test.cases]]
name = "Derive.FromStrMissingTransparent"
source = "compile/from_str_missing_transparent.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::FromStr: record requires explicit transparent"]

[[compile-test.cases]]
name = "Derive.AliasCaseCollision"
source = "compile/alias_case_collision.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::FromStr: enum name or alias collision for 'SHARED' after ASCII case folding"]

[[compile-test.cases]]
name = "Derive.UnknownHelper"
source = "compile/unknown_helper.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::Debug: unknown or invalid option 'unknownhelper' on record types"]

[[compile-test.cases]]
name = "Derive.FieldWithoutDebug"
source = "compile/field_without_debug.cpp"
outcome = "failure"
diagnostic-contains = ["Debug fields must implement rstd::fmt::Debug"]

[[compile-test.cases]]
name = "Derive.EnumIterRequiresEnum"
source = "compile/enum_iter_record.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::EnumIter: derive requires an enum"]

[[compile-test.cases]]
name = "Derive.EnumTryFromRequiresEnum"
source = "compile/enum_try_from_record.cpp"
outcome = "failure"
diagnostic-contains = ["rstd::TryFrom: derive requires an enum"]

[[compile-test.cases]]
name = "FmtArguments.OutOfRange"
source = "compile/format_index.cpp"
outcome = "failure"
diagnostic-contains = ["fmt_invalid_argument"]

[[compile-test.cases]]
name = "FmtArguments.Overflow"
source = "compile/format_index_overflow.cpp"
outcome = "failure"
diagnostic-contains = ["fmt_invalid_argument"]
