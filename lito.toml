[workspace]
name = "rstd"
members = [
  "src/basic",
  "src/runtime",
  "src/core",
  "src/alloc",
  "src/parse",
  "src/serde",
  "src/argparse",
  "src/std",
  "src/bench",
  "src/test",
  "src/cppstd",
  "src/json",
  "src/toml",
  "src/log",
  "src/dlopn",
  "src/nostd",
]

[workspace.package]
version = "0.1.9"
license = "MIT OR Apache-2.0"
authors = ["hypengw <hypengwip@gmail.com>"]

[workspace.dependencies]
rstd-bench = { path = "src/bench", version = "0.1.9" }
rstd-json = { path = "src/json", version = "0.1.9" }
rstd-basic = { path = "src/basic", version = "0.1.9" }
rstd-runtime = { path = "src/runtime", version = "0.1.9" }
rstd-core = { path = "src/core", version = "0.1.9" }
rstd-alloc = { path = "src/alloc", version = "0.1.9" }
rstd-parse = { path = "src/parse", version = "0.1.9" }
rstd-serde = { path = "src/serde", version = "0.1.9" }
rstd-std = { path = "src/std", version = "0.1.9" }

[profile.base]
exceptions = false
rtti = false
